
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
      <title>Fuel 2.0 — York IE</title>
      <meta name="description" content="Fuel by York IE — the operating platform for startup founders and investors. Track development, GTM, RevOps, and FinOps progress with benchmarks and intelligence." />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <meta name="robots" content="noindex, nofollow" />
      <style>
        html, body { height: 100%; margin: 0; background: #f7f8fa; }
        #root { height: 100%; min-height: 100%; }
        #boot-loader {
          align-items: center;
          color: #1a2332;
          display: flex;
          font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          height: 100%;
          justify-content: center;
        }
        #boot-error {
          color: #b42318;
          display: none;
          font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          font-size: 14px;
          line-height: 1.5;
          max-width: 520px;
          padding: 24px;
        }
      </style>
      
    </head>

    <body>
      
      <div id="root">
        <div id="boot-loader">Loading Fuel…</div>
      </div>
      <div id="boot-error" role="alert"></div>
      <script>
        window.addEventListener("error", function (event) {
          var el = document.getElementById("boot-error");
          var loader = document.getElementById("boot-loader");
          if (!el) return;
          if (loader) loader.style.display = "none";
          el.style.display = "block";
          el.textContent = "Fuel failed to load: " + (event.message || "Unknown error");
        });
      </script>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
