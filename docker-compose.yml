services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fuel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fuel
      POSTGRES_PASSWORD: fuel
      POSTGRES_DB: fuel
    ports:
      - "5433:5432"
    volumes:
      - fuel-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuel -d fuel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fuel-pgdata:
